# Temporary cloud rehearsal only. Separate database/volume; never use production credentials.
name: miaoban-cloud-acceptance
services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: miaoban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a private acceptance password}
      POSTGRES_DB: miaoban_acceptance
    volumes: ["database:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miaoban -d miaoban_acceptance"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: miaoban-api:${RELEASE_TAG:?Use the verified deployment image}
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://miaoban:${POSTGRES_PASSWORD}@db:5432/miaoban_acceptance
      PUBLIC_URL: http://localhost:18001
      PUSH_PROVIDER: disabled
    ports: ["127.0.0.1:18001:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  database:
