name: miaoban-test
services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: miaoban_test
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: miaoban_test
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miaoban_test -d miaoban_test"]
      interval: 2s
      timeout: 3s
      retries: 30
